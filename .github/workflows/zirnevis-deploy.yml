name: Deploy Zirnevis to Hugging Face

# Publishes the in-browser app (zirnevis-web/) as a free static Space:
# https://huggingface.co/spaces/mehrshadjavid/zirnevis
# Needs a repository secret HF_TOKEN (a Hugging Face token with "Write" access).

on:
  push:
    branches: [main, claude/funny-noether-yicsky]
    paths: ["zirnevis-web/**", "!zirnevis-web/model/**", ".github/workflows/zirnevis-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: zirnevis-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPACE_ID: mehrshadjavid/zirnevis
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is set
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a repository secret named HF_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the tests
        working-directory: zirnevis-web
        run: node --test tests/*.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload to the Space
        run: |
          pip install -q huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]
          api.create_repo(space, repo_type="space", space_sdk="static", exist_ok=True)
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="zirnevis-web",
              ignore_patterns=["tests/*", "model/*", "package.json", "node_modules/*"],
              delete_patterns=["*.js", "*.css", "*.html", "lib/*"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
          )
          print(f"Deployed: https://huggingface.co/spaces/{space}")
          EOF
